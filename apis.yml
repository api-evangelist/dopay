aid: dopay
name: dopay
description: >-
  dopay is a digital payroll platform operating in Egypt that lets employers
  register employees and disburse salaries in minutes through a single system,
  including permanent, temporary, and seasonal workers across construction,
  agriculture, hospitality, retail, healthcare, education, and manufacturing.
  Supervised by a bank and regulated by the Central Bank of Egypt, dopay
  digitizes cash-based wage payments and pairs core Salary Disbursement with an
  Early Pay earned-wage-access product that lets employees withdraw part of
  their salary before payday. Originally a Techstars-backed fintech focused on
  banking the unbanked, dopay is added to the API Evangelist network as a
  company profile; it publishes a business web app and login but no public
  developer API, portal, or documentation at this time.
